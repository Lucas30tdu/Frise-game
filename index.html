<style>
:root{--bg:#ececec;--surf:#fff;--ink:#222;--mute:#777;--line:#bbb;--acc:#444;--ok:#3a7d44;--ko:#b3402f;--back:#555;--backink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1c;--surf:#2c2c2c;--ink:#eee;--mute:#999;--line:#555;--acc:#ccc;--ok:#6fb77a;--ko:#e07a6a;--back:#ddd;--backink:#222}}
:root[data-theme="dark"]{--bg:#1c1c1c;--surf:#2c2c2c;--ink:#eee;--mute:#999;--line:#555;--acc:#ccc;--ok:#6fb77a;--ko:#e07a6a;--back:#ddd;--backink:#222}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:15px}
#lives{letter-spacing:4px;color:var(--ko)}
#msg{text-align:center;color:var(--mute);font-size:14px;min-height:20px;padding:0 16px}
#msg.ok{color:var(--ok)}#msg.ko{color:var(--ko)}
#strip{flex:1;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;padding:0 20px;perspective:900px;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
#line{display:flex;align-items:center;margin:auto;position:relative;transform-style:preserve-3d}
#line::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);z-index:0}
.slot{position:relative;z-index:1;flex:none;width:34px;height:130px;border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--mute);font-size:22px;cursor:pointer;margin:0 6px;transition:width .2s,background .2s,border-color .2s}
.slot.big{width:140px}
.slot.hot{background:var(--surf);border-color:var(--acc);border-style:solid}
.slot:disabled{opacity:.3}
.t{position:relative;z-index:1;flex:none;width:144px;height:188px;margin:0 4px;perspective:700px;transform:rotateX(8deg) rotateY(var(--ty,0deg))}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.25,.5,1)}
.t.fl .in{transform:rotateY(180deg)}
.t.pend{animation:pop .45s}
.t.bad{animation:sh .4s}
@keyframes pop{from{transform:translateY(-40px) rotateX(55deg);opacity:0}}
@keyframes sh{20%{margin-left:-2px;margin-right:10px}40%{margin-left:10px;margin-right:-2px}60%{margin-left:2px;margin-right:6px}}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surf);box-shadow:0 8px 18px rgba(0,0,0,.22)}
.b{transform:rotateY(180deg)}
.b strong{font-size:24px;font-variant-numeric:tabular-nums}
.t span.n{font-size:12px;line-height:1.3;color:var(--ink)}
.f .q{font-size:30px;color:var(--mute);text-align:center}
.cat{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:5px}
.cat i{width:9px;height:9px;border-radius:50%;background:var(--c)}
#stage{height:250px;display:flex;align-items:center;justify-content:center;perspective:800px;padding-bottom:16px;position:relative;z-index:5}
#tilt{width:170px;height:210px;transform-style:preserve-3d;transform:translate(var(--dx,0px),var(--dy,0px)) scale(var(--s,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s;touch-action:none;cursor:grab}
#tilt.rel{transition:transform .5s}
#tilt.gone{visibility:hidden;transition:none}
#card{width:100%;height:100%}
#card.deal{animation:deal .6s}
@keyframes deal{from{transform:translateY(70px) rotateX(45deg);opacity:0}}
#card .face{position:absolute;inset:0;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surf);box-shadow:0 14px 28px rgba(0,0,0,.3);font-size:18px;line-height:1.3;font-weight:600}
#card small{font-weight:400;color:var(--mute);font-size:13px}
#card .cat{font-size:13px;font-weight:400}
#end{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#end.on{display:flex}
#end>div{background:var(--surf);border-radius:16px;padding:28px;text-align:center;max-width:280px}
#end h2{margin:0 0 8px}
button.go{margin-top:16px;padding:12px 24px;border:0;border-radius:10px;background:var(--acc);color:var(--bg);font-size:16px;cursor:pointer}
#joker{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}#joker:disabled{opacity:.4}
#joker svg{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
.slot.hint{border-color:var(--ok);border-style:solid;animation:hint .8s infinite alternate}
@keyframes hint{to{background:var(--surf);box-shadow:0 0 16px var(--ok)}}
.t.win .b{animation:glow .9s}
@keyframes glow{30%{box-shadow:0 0 0 4px var(--ok),0 0 34px var(--ok)}}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:20;border-radius:2px}
header{align-items:flex-start;gap:8px}
#pls{display:flex;gap:8px;flex:1}
.pl{flex:1;padding:6px 10px;border-radius:10px;background:var(--surf);font-size:13px;line-height:1.4;border:2px solid transparent;opacity:.55}
.pl.on{opacity:1;border-color:var(--acc)}
.pl .h{color:var(--ko);letter-spacing:2px}
#an{text-align:center;color:var(--mute);font-size:13px;font-style:italic;min-height:38px;padding:2px 20px 0}
.t[data-o="0"] .b{box-shadow:0 8px 18px rgba(0,0,0,.22),inset 0 5px 0 #4aa8ff}
.t[data-o="1"] .b{box-shadow:0 8px 18px rgba(0,0,0,.22),inset 0 5px 0 #ff7a59}
#guess{position:fixed;left:0;right:0;bottom:0;height:250px;background:var(--bg);z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 28px env(safe-area-inset-bottom,0px)}
#guess.on{display:flex}
#gt{font-size:14px;color:var(--mute);text-align:center}
#gv{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
#gr{width:100%}
.gb{display:flex;gap:10px}
button.alt{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
#ec button{margin:8px 6px 0}
#snd{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:16px;cursor:pointer}
#snd.off{opacity:.45;text-decoration:line-through}
#learn{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#learn.on{display:flex}
#lh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
#ll{flex:1;overflow-y:auto;padding:0 16px 60px}
.lr{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.lr b{font-size:16px;font-variant-numeric:tabular-nums}
.lr p{margin:4px 0 0;font-size:13px;color:var(--mute);font-style:italic}
.lr[data-r="ok"] b::after{content:" ✓";color:var(--ok)}
.lr[data-r="ko"] b::after{content:" ✗";color:var(--ko)}
#line{border-radius:16px;padding:8px 0}
.t .f,.t .b{background:color-mix(in srgb,var(--ec,var(--surf)) 22%,var(--surf))}
.em{position:absolute;top:8px;right:10px;font-size:20px;line-height:1}
#card .em{top:14px;right:16px;font-size:30px}
.er{font-size:10px;color:var(--mute)}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.slot em{font-style:normal;font-size:10px;color:var(--mute);writing-mode:vertical-rl;margin-top:6px}
#home{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 24px)}
#home.on{display:block}
#home h1{margin:8px 0 2px;font-size:30px}

<h2>Comment jouer ?</h2>
<p>Placez chaque carte à la bonne place dans la frise, de la plus ancienne à la plus récente. Chaque carte affiche son intitulé, sa date reste cachée.</p>
<h3>Le principe</h3>
<ol>
<li>Glissez la carte vers un emplacement de la frise, ou touchez-le. La première carte se pose dans la frise vide.</li>
<li>Si le placement est bon, la carte se retourne et révèle sa date : vous gagnez des points.</li>
<li>Sinon, la carte se retourne quand même, vous perdez une vie et la date est révélée.</li>
</ol>
<h3>Points</h3>
<ul>
<li>10 points par bonne carte, multipliés par la série (jusqu’à ×5).</li>
<li><b>Bonus de précision</b> (option) : après un bon placement, devinez l’année exacte. Plus vous êtes proche, plus vous gagnez, jusqu’à 5 points.</li>
<li><b>Chronomètre</b> (option) : 15 secondes par carte. Un bonus de rapidité s’ajoute, et un temps écoulé compte comme une erreur.</li>
</ul>
<h3>Séries et joker</h3>
<ul>
<li>Chaque bonne carte d’affilée prolonge la série ; une erreur la remet à zéro.</li>
<li>Toutes les 5 bonnes cartes d’affilée, vous gagnez un joker. Vous commencez la partie avec 1 joker.</li>
<li>Le joker met en évidence l’emplacement exact et un emplacement voisin. Il n’est disponible qu’à partir de 3 cartes sur la frise.</li>
</ul>
<h3>Modes</h3>
<ul>
<li><b>Solo</b> : 3 vies. La partie se termine quand elles sont épuisées ou quand le paquet est vide.</li>
<li><b>Duel</b> : deux joueurs jouent à tour de rôle sur la même frise, avec 3 vies chacun. La partie s’arrête quand un joueur n’a plus de vie, et l’autre gagne. Sinon, le plus de points l’emporte.</li>
</ul>
<h3>Thèmes</h3>
<ul>
<li><b>Mélange</b> : toutes les cartes, toutes catégories confondues.</li>
<li><b>Histoire</b>, <b>Pop culture</b>, <b>Technologie</b>, <b>Sciences</b>, <b>Sport</b> : une catégorie chacune.</li>
<li><b>XXᵉ siècle</b> : les cartes des années 1900 à 1999.</li>
<li><b>Mes cartes</b> (premium) : uniquement vos cartes personnelles.</li>
<li><b>Au hasard</b> : un thème surprise.</li>
</ul>
<h3>Options et menus</h3>
<ul>
<li>Bonus de précision et chronomètre se cochent avant de lancer la partie.</li>
<li>Pause met la partie en attente ; « Reprendre la partie » sur le menu la relance.</li>
<li>« Apprendre », en fin de partie, affiche toutes les cartes avec leur date.</li>
<li>Paramètres : son, thème clair, sombre ou automatique, et couleur d’accentuation.</li>
<li>Collection : les badges se débloquent au fil des parties.</li>
</ul>
<h3>Parties gratuites</h3>
<p>Vous disposez de 3 parties gratuites par jour. La version premium débloque les parties sans limite, 200 cartes supplémentaires, 6 thèmes colorés, l’ajout de dates personnelles pour un jeu unique et le badge « Contributeur ».</p>
</div>
